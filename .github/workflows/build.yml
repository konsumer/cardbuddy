name: Build

on:
  push:
  pull_request:
  release:
    types: [published]

# On main and on a release (from its tag, so the page's version and the firmware's are the release's), the web page
# (site/) goes to GitHub Pages with the firmware next to it (site/fw/). Settings -> Pages -> Source: GitHub Actions.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # fm1buddy's core (lib/fm1core), where platformio.ini looks for it
      - run: git clone --depth 1 https://github.com/konsumer/fm1buddy.git ../fm1buddy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install --upgrade platformio
      # the same version as the page's manifest (tools/site.sh): the tag on a release
      - run: echo "VERSION=$(git describe --tags --always)" >> "$GITHUB_ENV"
      - run: pio run
        env:
          PLATFORMIO_BUILD_FLAGS: -D FM1BUDDY_VERSION='"${{ env.VERSION }}"'
      - run: mkdir -p dist && cp .pio/build/cardputer/firmware.bin dist/cardbuddy.bin
      - uses: actions/upload-artifact@v4
        with:
          name: cardbuddy
          path: dist/cardbuddy.bin
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/cardbuddy.bin
      - name: the page, with the firmware
        run: tools/site.sh
      - if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

; cardbuddy: fm1buddy's core (lib/fm1core) and its ESP32-S3 side (lib/fm1s3) on the M5 Cardputer (ADV):
; pio run -t upload
;
; both come from fm1buddy beside this repo (../fm1buddy): CI checks it out there too

[platformio]
default_envs = cardputer

[env:cardputer]
; the same platform as fm1buddy (Arduino 3, TinyUSB host later)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
; 8 MB, two app slots: M5 Launcher puts the app in its own slot instead
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
; after flashing: a watchdog reset, so it starts its program (the hard reset can leave the S3 in download mode)
board_upload.after_reset = watchdog-reset
build_flags =
    '-D APP_NAME="cardbuddy"'
    '-D APP_LOG="cardbuddy-log"'
    '-D FM1BUDDY_BIN="cardbuddy.bin"'
    -D SCREEN_W=240
    -D SCREEN_H=135
    ; crashes kept for the log (fm1s3's hal_s3.cpp onPanic)
    -Wl,--wrap=esp_panic_handler
    ; the USB-C port is USB serial (flashing, logs) with a computer on it at power-on, else the USB host
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; the USB host: TinyUSB, with fm1s3's config
    -I ../fm1buddy/lib/fm1s3/src
    '-D CFG_TUSB_CONFIG_FILE="tusb_config_fm1buddy.h"'
lib_deps =
    M5Cardputer=https://github.com/m5stack/M5Cardputer
    bblanchon/ArduinoJson@7.2.1
    h2zero/NimBLE-Arduino@2.5.1
    https://github.com/hathach/tinyusb.git#0.21.0
    fm1core=symlink://../fm1buddy/lib/fm1core
    fm1s3=symlink://../fm1buddy/lib/fm1s3
